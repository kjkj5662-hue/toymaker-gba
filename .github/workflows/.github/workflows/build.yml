name: Build GBA ROM

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ROM
        run: |
          make -j$(nproc)
          ls -lh *.gba *.elf

      - name: Upload GBA artifact
        uses: actions/upload-artifact@v4
        with:
          name: toymaker_final-gba
          path: |
            *.gba
            *.elf
          if-no-files-found: error
